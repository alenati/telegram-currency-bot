name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.3"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        env:
          PG_HOST: localhost
          PG_USER: test_user
          PG_PASSWORD: test_password
          PG_DB_NAME: test_db
          TG_API_KEY: test_token
          NEWS_API_KEY: test_api
          NEWS_URL: test_uri
          MG_COLLECTION_NAME: test_mg
          MG_CLIENT_URI: test_client
          LANGUAGE: "en"
          LOGS: "true"
          RETRIES: 5
        run: python -m pytest